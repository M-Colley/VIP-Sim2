name: Build VIP-Sim

# Reproducible builds for all three desktop targets.
#
# Before this existed, releases were produced by hand from whichever machine the
# author happened to be on, which is how the windows/ and macos/ projects drifted
# apart in the first place (different Unity patch versions, different package
# resolutions). Pinning the editor version here makes that class of drift a CI
# failure rather than a silent behavioural difference between platforms.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.5.8f1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap structural checks that do not need a Unity licence. These run on every
  # push and catch the failure modes that actually bit this project.
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - name: Both projects must target the same Unity version
        run: |
          win=$(grep '^m_EditorVersion:' windows/ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          mac=$(grep '^m_EditorVersion:' macos/ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          echo "windows=$win macos=$mac expected=$UNITY_VERSION"
          test "$win" = "$mac" || { echo "::error::projects target different Unity versions"; exit 1; }
          test "$win" = "$UNITY_VERSION" || { echo "::error::projects do not target $UNITY_VERSION"; exit 1; }

      - name: Simulation code must be identical across platforms
        # The scientific claim of VIP-Sim is that it reproduces a given symptom.
        # If the shaders differ per platform that claim silently stops holding,
        # which is exactly what had happened to myFieldLoss and VortexEffect.
        run: |
          status=0
          while IFS= read -r f; do
            rel=${f#windows/Assets/}
            [ -f "macos/Assets/$rel" ] || { echo "::error::missing on macOS: $rel"; status=1; continue; }
            if ! cmp -s "$f" "macos/Assets/$rel"; then
              echo "::error::simulation code differs between platforms: $rel"
              diff -u "$f" "macos/Assets/$rel" | head -40 || true
              status=1
            fi
          done < <(find windows/Assets/VisualEffects -type f \( -name '*.cs' -o -name '*.shader' -o -name '*.compute' -o -name '*.cginc' \))
          exit $status

      - name: Barracuda must not come back
        # UnitEye 1.1 uses the Inference Engine. Barracuda and the Inference Engine
        # both register an .onnx importer and cannot coexist in one project.
        run: |
          if grep -rn --include=manifest.json -e 'com.unity.barracuda' -e 'jp.ikep' -e 'jp.keijiro' windows/Packages macos/Packages; then
            echo "::error::Barracuda-era dependency reintroduced"
            exit 1
          fi
          echo "clean"

      - name: Shared packages must resolve
        run: |
          for p in windows macos; do
            for dep in uniteye com.github.homuler.mediapipe; do
              test -f "packages/$dep/package.json" \
                || { echo "::error::packages/$dep missing"; exit 1; }
            done
          done
          echo "ok"

  build:
    name: ${{ matrix.name }}
    needs: guardrails
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            project: windows
            targetPlatform: StandaloneWindows64
          - name: macOS
            project: macos
            targetPlatform: StandaloneOSX
          - name: Linux
            project: windows          # Linux builds from the Windows project tree
            targetPlatform: StandaloneLinux64
            experimental: true

    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      # Unity's Library/ is large and slow to rebuild; cache it per project+target.
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.project }}/Library
          key: Library-${{ matrix.project }}-${{ matrix.targetPlatform }}-${{ hashFiles(format('{0}/Packages/manifest.json', matrix.project)) }}
          restore-keys: |
            Library-${{ matrix.project }}-${{ matrix.targetPlatform }}-
            Library-${{ matrix.project }}-

      - name: Free disk space
        # MediaPipe's native libs plus the Unity image leave the default runner tight.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ matrix.project }}
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true
        continue-on-error: ${{ matrix.experimental == true }}

      - uses: actions/upload-artifact@v4
        with:
          name: VIP-Sim-${{ matrix.name }}
          path: build
          if-no-files-found: warn
